<!DOCTYPE html>

<html>

<head>

    <title>Candidate Registration</title>

    <style>

    * {
        box-sizing: border-box;
    }


    body {

        font-family: Arial, sans-serif;

        margin: 0;

        padding: 35px;

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #e8f5ff 0%,
                #f5f0ff 50%,
                #eafaf4 100%
            );

        color: #173b5c;

    }


    .form-container {

        width: 100%;

        max-width: 1050px;

        margin: auto;

        padding: 35px 40px;

        background: rgba(255, 255, 255, 0.97);

        border-radius: 20px;

        border: 1px solid #d9e8f3;

        box-shadow:
            0 15px 40px rgba(30, 80, 130, 0.14);

    }


    h2 {

        margin: 0 0 30px 0;

        padding: 0 0 18px 15px;

        font-size: 30px;

        color: #123f68;

        border-bottom: 2px solid #dceaf4;

        position: relative;

    }


    /* Colour highlight beside heading */

    h2::before {

        content: "";

        position: absolute;

        left: 0;

        top: 2px;

        width: 5px;

        height: 32px;

        border-radius: 5px;

        background:
            linear-gradient(
                #087bd0,
                #6548d8
            );

    }

    label {

        display: block;

        margin-top: 18px;

        margin-bottom: 7px;

        font-size: 14px;

        font-weight: bold;

        color: #245579;

    }


    input {

        width: 100%;

        height: 52px;

        padding: 12px 16px;

        margin-top: 0;

        font-size: 15px;

        color: #244862;

        background: #fafdff;

        border: 1px solid #c9dce9;

        border-radius: 10px;

        outline: none;

        transition: all 0.25s;

    }


    input:hover {

        border-color: #72b3d9;

        background: #ffffff;

    }



    input:focus {

        border-color: #087bd0;

        background: #ffffff;

        box-shadow:
            0 0 0 4px rgba(8, 123, 208, 0.10);

    }


    input::placeholder {

        color: #9aafbf;

    }


    h3 {

        margin-top: 28px;

        margin-bottom: 12px;

        padding: 13px 18px;

        font-size: 20px;

        color: #124d70;

        background:
            linear-gradient(
                90deg,
                #e8f6ff,
                #f2f0ff
            );

        border-left: 5px solid #087bd0;

        border-radius: 8px;

    }


    video {

        width: 100%;

        max-width: 650px;

        height: 300px;

        display: block;

        margin-top: 12px;

        background: #59636c;

        border: 4px solid #b8d9eb;

        border-radius: 14px;

        object-fit: cover;

        box-shadow:
            0 8px 22px rgba(30, 80, 120, 0.16);

    }



    button {

        padding: 13px 22px;

        margin: 14px 8px 10px 0;

        border-radius: 9px;

        border: none;

        font-size: 14px;

        font-weight: bold;

        cursor: pointer;

        transition: all 0.25s;

    }


    #startCamera {

        color: white;

        background:
            linear-gradient(
                135deg,
                #087bd0,
                #2665db
            );

        box-shadow:
            0 5px 14px rgba(8, 123, 208, 0.22);

    }


    #startCamera:hover {

        transform: translateY(-2px);

        background:
            linear-gradient(
                135deg,
                #056bb8,
                #3651c9
            );

    }



    #capturePhoto {

        color: #17658d;

        background: #ffffff;

        border: 1px solid #b8d5e6;

    }


    #capturePhoto:hover:not(:disabled) {

        background: #eaf7ff;

        border-color: #58a9d4;

        transform: translateY(-2px);

    }


  

    button:disabled {

        opacity: 0.45;

        cursor: not-allowed;

    }


  

    #preview {

        width: 180px;

        height: 180px;

        margin-top: 15px;

        display: none;

        object-fit: cover;

        border: 4px solid #25b86b;

        border-radius: 12px;

        background: white;

        box-shadow:
            0 7px 18px rgba(30, 150, 90, 0.18);

    }


   
    #canvas {

        display: none;

    }


    
    #photoStatus {

        display: inline-block;

        margin-top: 10px;

        padding: 9px 14px;

        border-radius: 8px;

        font-size: 13px;

        font-weight: bold;

        color: #176b91;

        background: #eaf7ff;

        border-left: 4px solid #087bd0;

    }

    #registerButton {

        width: 100%;

        margin-top: 25px;

        padding: 16px;

        border-radius: 11px;

        border: none;

        color: white;

        font-size: 17px;

        font-weight: bold;

        letter-spacing: 0.8px;

        background:
            linear-gradient(
                135deg,
                #087bd0,
                #5b49d8
            );

        box-shadow:
            0 8px 20px
            rgba(55, 80, 200, 0.24);

    }


    #registerButton:hover:not(:disabled) {

        transform: translateY(-2px);

        box-shadow:
            0 12px 25px
            rgba(55, 80, 200, 0.32);

    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

        body {

            padding: 15px;

        }


        .form-container {

            padding: 25px 20px;

        }


        h2 {

            font-size: 25px;

        }


        video {

            height: 240px;

        }


        button {

            width: 100%;

            margin-right: 0;

        }

    }

</style>
    

</head>


<body>


<div class="form-container">


    <h2>Candidate Registration</h2>


    <form method="POST" id="registerForm">


        <!-- NAME -->

        <label>Name</label>

        <input
            type="text"
            name="name"
            required
        >


        <br>


        <!-- EMAIL -->

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >


        <br>


        <!-- PASSWORD -->

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >


        <br><br>


        <!-- CAMERA -->

        <h3>Candidate Photo</h3>


        <video
            id="camera"
            autoplay
            playsinline
        ></video>


        <br>


        <!-- START CAMERA -->

        <button
            type="button"
            id="startCamera"
        >

            Start Camera

        </button>


        <!-- CAPTURE PHOTO -->

        <button
            type="button"
            id="capturePhoto"
            disabled
        >

            Capture Photo

        </button>


        <!-- CANVAS -->

        <canvas id="canvas"></canvas>


        <!-- PHOTO PREVIEW -->

        <img
            id="preview"
            alt="Captured Photo"
        >


        <p id="photoStatus"></p>


        <br>


        <!-- REGISTER -->

        <button
            type="submit"
            id="registerButton"
            disabled
        >

            Register

        </button>


    </form>


</div>


<script>


    // ----------------------------------------
    // Get HTML elements
    // ----------------------------------------

    const video =
        document.getElementById("camera");


    const canvas =
        document.getElementById("canvas");


    const preview =
        document.getElementById("preview");


    const startCameraButton =
        document.getElementById("startCamera");


    const captureButton =
        document.getElementById("capturePhoto");


    const registerButton =
        document.getElementById("registerButton");


    const photoStatus =
        document.getElementById("photoStatus");


    // Store camera stream

    let cameraStream = null;



    // ----------------------------------------
    // START CAMERA
    // ----------------------------------------

    startCameraButton.addEventListener(
        "click",
        async function () {

            try {

                // Ask browser for camera permission

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: true

                    });


                // Show camera inside video element

                video.srcObject =
                    cameraStream;


                // Enable capture button

                captureButton.disabled =
                    false
                photoStatus.textContent =
                    "Camera started. Position your face and click Capture Photo.";

            }

            catch (error) {

                console.error(error);


                photoStatus.textContent =
                    "Unable to access camera. Please allow camera permission.";

            }

        }
    );



    // ----------------------------------------
    // CAPTURE PHOTO
    // ----------------------------------------

    captureButton.addEventListener(
        "click",
        function () {


            // Set canvas size same as camera

            canvas.width =
                video.videoWidth;


            canvas.height =
                video.videoHeight;


            // Get canvas drawing context

            const context =
                canvas.getContext("2d");


            // Copy video frame to canvas

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Display captured image

            const imageData =
                canvas.toDataURL("image/jpeg");


            preview.src =
                imageData;


            preview.style.display =
                "block";


            photoStatus.textContent =
                "Photo captured. Saving...";



            // Convert canvas image
            // into Blob

            canvas.toBlob(
                async function (blob) {


                    // Create form data

                    const formData =
                        new FormData();


                    // Add photo

                    formData.append(
                        "photo",
                        blob,
                        "candidate.jpg"
                    );



                    // Send photo to Flask

                    const response =
                        await fetch(
                            "/capture-photo",
                            {
                                method: "POST",
                                body: formData
                            }
                        );



                    // Convert response to JSON

                    const result =
                        await response.json();



                    // Check result

                    if (result.success) {


                        photoStatus.textContent =
                            "Photo captured successfully!";


                        // Enable Register button

                        registerButton.disabled =
                            false;



                        // Stop camera

                        if (cameraStream) {

                            cameraStream
                                .getTracks()
                                .forEach(
                                    function(track) {

                                        track.stop();

                                    }
                                );

                        }

                    }

                    else {


                        photoStatus.textContent =
                            "Photo capture failed.";

                    }


                },
                "image/jpeg"
            );

        }
    );


</script>


</body>

</html>
