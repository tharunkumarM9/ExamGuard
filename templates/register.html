<script>


    // ----------------------------------------
    // Get HTML elements
    // ----------------------------------------

    const video =
        document.getElementById("camera");


    const canvas =
        document.getElementById("canvas");


    const preview =
        document.getElementById("preview");


    const startCameraButton =
        document.getElementById("startCamera");


    const captureButton =
        document.getElementById("capturePhoto");


    const registerButton =
        document.getElementById("registerButton");


    const photoStatus =
        document.getElementById("photoStatus");


    // Store camera stream

    let cameraStream = null;



    // ----------------------------------------
    // START CAMERA
    // ----------------------------------------

    startCameraButton.addEventListener(
        "click",
        async function () {

            try {

                // Ask browser for camera permission

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: true

                    });


                // Show camera inside video element

                video.srcObject =
                    cameraStream;


                // Enable capture button

                captureButton.disabled =
                    false
                photoStatus.textContent =
                    "Camera started. Position your face and click Capture Photo.";

            }

            catch (error) {

                console.error(error);


                photoStatus.textContent =
                    "Unable to access camera. Please allow camera permission.";

            }

        }
    );



    // ----------------------------------------
    // CAPTURE PHOTO
    // ----------------------------------------

    captureButton.addEventListener(
        "click",
        function () {


            // Set canvas size same as camera

            canvas.width =
                video.videoWidth;


            canvas.height =
                video.videoHeight;


            // Get canvas drawing context

            const context =
                canvas.getContext("2d");


            // Copy video frame to canvas

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Display captured image

            const imageData =
                canvas.toDataURL("image/jpeg");


            preview.src =
                imageData;


            preview.style.display =
                "block";


            photoStatus.textContent =
                "Photo captured. Saving...";



            // Convert canvas image
            // into Blob

            canvas.toBlob(
                async function (blob) {


                    // Create form data

                    const formData =
                        new FormData();


                    // Add photo

                    formData.append(
                        "photo",
                        blob,
                        "candidate.jpg"
                    );



                    // Send photo to Flask

                    const response =
                        await fetch(
                            "/capture-photo",
                            {
                                method: "POST",
                                body: formData
                            }
                        );



                    // Convert response to JSON

                    const result =
                        await response.json();



                    // Check result

                    if (result.success) {


                        photoStatus.textContent =
                            "Photo captured successfully!";


                        // Enable Register button

                        registerButton.disabled =
                            false;



                        // Stop camera

                        if (cameraStream) {

                            cameraStream
                                .getTracks()
                                .forEach(
                                    function(track) {

                                        track.stop();

                                    }
                                );

                        }

                    }

                    else {


                        photoStatus.textContent =
                            "Photo capture failed.";

                    }


                },
                "image/jpeg"
            );

        }
    );


</script>
