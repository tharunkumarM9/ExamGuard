<!DOCTYPE html>
<html>

<head>
    <title>ExamGuard Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f0e8;
            color: #26332d;
            text-align: center;
        }

        h1 {
            margin-top: 80px;
            color: #34483d;
        }

        form {
            width: 350px;
            margin: 30px auto;
            padding: 35px;
            background: #ffffff;
            border: 1px solid #d9ddd5;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(38, 51, 45, 0.08);
            text-align: left;
        }

        label {
            color: #46574d;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #c7cec8;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #7d9184;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #536b5d;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #3f5548;
        }
    </style>

</head>

<body>

    <h1>Candidate Registration</h1>

    <form method="POST" enctype="multipart/form-data">

        <label>Name</label>

        <input 
            type="text" 
            name="name"
        >

        <br><br>

        <label>Email</label>

        <input 
            type="email" 
            name="email"
        >

        <br><br>

        <label>Password</label>


        <input 
            type="password" 
            name="password"
        >

        <br><br>
        <!-- CAMERA -->

        <h3>Candidate Photo</h3>


        <video
            id="camera"
            autoplay
            playsinline
        ></video>


        <br>


        <!-- START CAMERA -->

        <button
            type="button"
            id="startCamera"
        >

            Start Camera

        </button>


        <!-- CAPTURE PHOTO -->

        <button
            type="button"
            id="capturePhoto"
            disabled
        >

            Capture Photo

        </button>


        <!-- CANVAS -->

        <canvas id="canvas"></canvas>


        <!-- PHOTO PREVIEW -->

        <img
            id="preview"
            alt="Captured Photo"
        >


        <p id="photoStatus"></p>


        <br>


        <!-- REGISTER -->

        <button
            type="submit"
            id="registerButton"
            disabled
        >

            Register

        </button>

        
    </form>


<script>
    const startCameraButton = document.getElementById('startCamera');
    const capturePhotoButton = document.getElementById('capturePhoto');
    const registerButton = document.getElementById('registerButton');
    const camera = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const photoStatus = document.getElementById('photoStatus');
    const preview = document.getElementById('preview');

    let cameraStream = null;
    startCameraButton.addEventListener('click', async function(){
        try{
            cameraStream=await navigator.mediaDevices.getusermedia({video:true});
            camera.srcObject=cameraStream // show camera in video element
            capturePhotoButton.disabled=false;
            photoStatus.textContent="Camera started. You can capture your photo now.";
        }
        catch(error){
            console.error("Error accessing camera:",error);
            photoStatus.textContent="Error accessing camera. Please check your permissions.";
        }
    })
    capturePhotoButton.addEventListener('click',function(){
        
        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;
        const context=canvas.getContext('2d'); 
        // copy video frame to canvas
        context.drawImage(video,0,0,canvas.width,canvas.height);
        const imageData=canvas.toDataURL('image/jpeg'); // get image data as base64
        preview.src=imageData; // show captured photo in img element
        preview.style.display='block';
        photoStatus.textContent="Photo captured. You can now register.";
        canvas.toBlob(async function(blob){
            const formData=new FormData();
            formData.append('photo',blob,'photo.jpg');
            try{
                const response=await fetch('/capture-photo',{
                    method:'POST',
                    body:formData
                });
                const result=await response.json();
                if(result.success==='True'){
                    photoStatus.textContent="Photo uploaded successfully.";
                    registerButton.disabled=false;
                }else{
                    photoStatus.textContent="Photo upload failed: "+result.message;
                }
            }catch(error){
                console.error("Error uploading photo:",error);
                photoStatus.textContent="Error uploading photo. Please try again.";
            }
        },'image/jpeg'
        )
    })
    </script>
    </body>

</html>
