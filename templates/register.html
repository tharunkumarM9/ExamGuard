<!DOCTYPE html>
<html>

<head>
    <title>ExamGuard Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f0e8;
            color: #26332d;
            text-align: center;
        }

        h1 {
            margin-top: 80px;
            color: #34483d;
        }

        form {
            width: 350px;
            margin: 30px auto;
            padding: 35px;
            background: #ffffff;
            border: 1px solid #d9ddd5;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(38, 51, 45, 0.08);
            text-align: left;
        }

        label {
            color: #46574d;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #c7cec8;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #7d9184;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #536b5d;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #3f5548;
        }
    </style>

</head>

<body>

    <h1>Candidate Registration</h1>

    <form method="POST" enctype="multipart/form-data">

        <label>Name</label>
        <input 
            type="text" 
            name="name"
        >

        <br><br>

        <label>Email</label>
        <input 
            type="email" 
            name="email"
        >

        <br><br>

        <label>Password</label>
        <input 
            type="password" 
            name="password"
        >

        <br><br>

        <label>Photo</label>
        <input type="file" name="photo" accept="image/*" required>

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>

</html>
